name: Paie Maroc - tests

on:
  push:
    paths: ['paie-maroc/**', '.github/workflows/paie-maroc-*.yml']
  pull_request:
    paths: ['paie-maroc/**']

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paie-maroc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paie-maroc/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx eslint src
      - run: npm run build
